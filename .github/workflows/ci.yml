name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # The Release workflow runs these checks before it builds anything.
  workflow_call:

# A newer push to the same branch or PR replaces the older run. When the
# Release workflow calls this one, github.workflow is "Release", so the group
# never collides with the caller's own; tag runs are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Cheap checks first, so a version problem fails before the toolchains install.
      - name: Verify version files are in sync
        run: node scripts/version.mjs

      - name: Verify the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          FILE_VERSION=$(node -e "process.stdout.write(require('./package.json').version)")
          if [ "v$FILE_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match repo version v$FILE_VERSION — bump with 'npm run bump' before tagging."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches repo version v$FILE_VERSION."

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ci-tests

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build frontend
        run: npm run build
