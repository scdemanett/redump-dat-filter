name: Release

on:
  push:
    tags:
      - v*
  # Manual dry run: builds every platform and attaches the bundles and portable
  # zips to the workflow run, without creating a tag or release.
  workflow_dispatch:

# A newer manual run replaces an older one; a release run is never cancelled
# half-way through publishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  # Gate the release — before any platform build — on the CI checks: version
  # files in sync, the tag matching them (on a tag push), typecheck, tests and
  # the frontend build. A failure here stops every build and no release is made.
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish-tauri:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: windows-x64
            args: ''
          - platform: macos-latest
            label: macos-arm64
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            label: macos-x64
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            label: linux-x64
            args: ''

    runs-on: ${{ matrix.platform }}
    # The Artifact Signing app registration trusts this environment's OIDC
    # token (subject repo:scdemanett@4528730/redump-dat-filter@1092734267:environment:release).
    environment: ${{ matrix.platform == 'windows-latest' && vars.AZURE_CLIENT_ID != '' && 'release' || '' }}
    permissions:
      contents: write
      id-token: write
    env:
      # Authenticode signing through Azure Artifact Signing (README, "Code
      # signing"); forks and runs without the Azure variables build unsigned.
      SIGN_WINDOWS: ${{ matrix.platform == 'windows-latest' && vars.AZURE_CLIENT_ID != '' }}
      SIGNING_CLIENT_VERSION: 1.0.146

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.label }}

      - name: Install dependencies
        run: npm ci

      # signCommand in tauri.signed.conf.json runs the runner's signtool
      # (Windows SDK 10.0.26100) with Microsoft's Artifact Signing dlib, which
      # authenticates through the Azure CLI session from azure/login (OIDC, no
      # client secret). The GitHub OIDC token expires within minutes, so a
      # codesigning access token (valid about an hour) is fetched right away
      # and the dlib reuses it from the CLI's cache during the build.
      - name: Azure login
        if: env.SIGN_WINDOWS == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Fetch Artifact Signing client
        if: env.SIGN_WINDOWS == 'true'
        shell: pwsh
        run: |
          az account get-access-token --resource https://codesigning.azure.net --query expiresOn -o tsv
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $pkg = "$env:RUNNER_TEMP\artifact-signing-client.zip"
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/Microsoft.ArtifactSigning.Client/$env:SIGNING_CLIENT_VERSION" -OutFile $pkg
          Expand-Archive $pkg -DestinationPath src-tauri\.artifact-signing

      # Windows builds add the signing overlay when the Azure variables are
      # set; Tauri then signs the app exe inside the installers, the NSIS
      # installer and uninstaller, and the MSI, before the updater signatures
      # are made. A pre-release tag carries a pre-release version (the verify
      # job checks they match), which MSI accepts only when numeric and RPM not
      # at all, so pre-release tags skip both; the updater uses NSIS and AppImage.
      - name: Build and publish
        id: tauri_build
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Only attach to a release on a tag push; manual runs just build.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseBody: 'See the assets to download this version and install.'
          # Stays a draft until every platform has uploaded; see publish-release below.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }} ${{ startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-') && '--config {"bundle":{"targets":["app","dmg","appimage","deb","nsis"]}}' || '' }} ${{ env.SIGN_WINDOWS == 'true' && '--config src-tauri/tauri.signed.conf.json' || '' }}

      # Tauri signs a bundle-type-patched copy of the exe for each installer and
      # then restores the original, so target/release holds an unsigned exe
      # again; sign it for the portable zip with the overlay's signCommand.
      - name: Sign portable exe
        if: env.SIGN_WINDOWS == 'true'
        shell: pwsh
        working-directory: src-tauri
        run: |
          $sign = (Get-Content tauri.signed.conf.json -Raw | ConvertFrom-Json).bundle.windows.signCommand
          & $sign.cmd ($sign.args -replace '^%1$', 'target\release\redump-dat-filter.exe')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Create portable unpacked zip
        run: node scripts/create-portable-zip.mjs --args "${{ matrix.args }}"

      - name: Upload portable unpacked zip
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          shopt -s nullglob
          files=(portable-dist/redump-dat-filter-unpacked-*.zip)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No portable zip found."
            exit 1
          fi
          printf 'Uploading portable artifact(s):\n'
          printf ' - %s\n' "${files[@]}"
          gh release upload "$tag" "${files[@]}" --clobber

      - name: Attach builds to the workflow run
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.label }}
          path: |
            ${{ join(fromJSON(steps.tauri_build.outputs.artifactPaths), '\n') }}
            portable-dist/redump-dat-filter-unpacked-*.zip

  # The updater reads latest.json from the latest published release, so only
  # publish once all platform builds have added their assets and entries.
  publish-release:
    needs: publish-tauri
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false
