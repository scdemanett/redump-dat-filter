name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      release_only:
        description: Skip builds and publish artifacts from an existing workflow run
        type: boolean
        default: false
      artifact_run_id:
        description: Workflow run ID with build artifacts (required when release_only is true)
        type: string
        required: false
      tag:
        description: Release tag to publish (required when release_only is true, e.g. v0.3.2)
        type: string
        required: false

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.release_only != true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            args: --win --x64
          - os: macos-latest
            platform: mac
            args: --mac --x64 --arm64
          - os: ubuntu-latest
            platform: linux
            args: --linux --x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Package
        run: npx electron-builder ${{ matrix.args }} -p never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename portable zip artifacts
        run: node scripts/rename-release-artifacts.mjs

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/redump-dat-filter-setup-*
            release/redump-dat-filter-unpacked-*
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

  release:
    needs: build
    if: |
      (
        startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'workflow_dispatch' && inputs.release_only == true)
      ) &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_only == true && inputs.tag || github.ref }}

      - name: Download artifacts from prior workflow run
        if: github.event_name == 'workflow_dispatch' && inputs.release_only == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          run_id="${{ inputs.artifact_run_id }}"
          if [ -z "$run_id" ]; then
            echo "artifact_run_id is required when release_only is true."
            exit 1
          fi

          mkdir -p release-artifacts
          gh run download "$run_id" --dir release-artifacts --pattern "release-*"

      - name: Download artifacts
        if: github.event_name != 'workflow_dispatch' || inputs.release_only != true
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List release artifacts
        run: find release-artifacts -type f | sort

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.release_only }}" = "true" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [ -z "$tag" ]; then
            echo "Release tag is required."
            exit 1
          fi

          if [[ ! "$tag" =~ ^v ]]; then
            echo "Release tag must start with v (got: $tag)."
            exit 1
          fi

          prerelease=false
          if [[ "$tag" == *-* ]]; then
            prerelease=true
          fi

          mapfile -t files < <(find release-artifacts -type f | sort -u)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release artifacts found."
            exit 1
          fi

          printf 'Uploading %s artifact(s) for %s:\n' "${#files[@]}" "$tag"
          printf ' - %s\n' "${files[@]}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
          else
            gh release create "$tag" \
              --title "$tag" \
              --generate-notes \
              --draft=false \
              --prerelease="$prerelease"
          fi

          gh release upload "$tag" "${files[@]}" --clobber

          if [ "$prerelease" = true ]; then
            gh release edit "$tag" --draft=false --prerelease
          else
            gh release edit "$tag" --draft=false --latest
          fi
