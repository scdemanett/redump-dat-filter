name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            args: --win --x64
          - os: macos-latest
            platform: mac
            args: --mac --x64 --arm64
          - os: ubuntu-latest
            platform: linux
            args: --linux --x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Package
        run: npx electron-builder ${{ matrix.args }} -p never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename portable zip artifacts
        run: node scripts/rename-release-artifacts.mjs

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/redump-dat-filter-setup-*
            release/redump-dat-filter-unpacked-*
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List release artifacts
        run: find release-artifacts -type f | sort

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          prerelease=false
          if [[ "$tag" == *-* ]]; then
            prerelease=true
          fi

          mapfile -t files < <(find release-artifacts -type f | sort -u)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release artifacts found."
            exit 1
          fi

          printf 'Uploading %s artifact(s):\n' "${#files[@]}"
          printf ' - %s\n' "${files[@]}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
          else
            gh release create "$tag" \
              --title "$tag" \
              --generate-notes \
              --prerelease="$prerelease"
          fi

          gh release upload "$tag" "${files[@]}" --clobber
