[package]
name = "redump-dat-filter"
version = "1.9.1"
description = "Tauri desktop app for filtering Redump DAT files by region."
authors = ["Steven Demanett"]
license = "MIT"
repository = "https://github.com/scdemanett/redump-dat-filter"
edition = "2021"
rust-version = "1.88.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
zip = "8.6.0"
once_cell = "1.21.4"
thiserror = "2.0.20"
chrono = "0.4.45"
urlencoding = "2.1.3"
uuid = "1.24.0"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-window-state = "2.4.1"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["json", "rustls"] }
tokio = { version = "1.53.1", features = ["time"] }
